name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test
      - run: pnpm run test:coverage
      - run: npm pack --dry-run

  cli-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Initialize Claude/Codex runtime without CodeGraph
        run: node bin/specpilot.js init "${{ runner.temp }}/specpilot-smoke" --host all --graph none --yes --json

      - name: Exercise status, doctor, evidence, and update
        run: |
          node bin/specpilot.js init knowledge "${{ runner.temp }}/specpilot-smoke" --json
          node bin/specpilot.js status "${{ runner.temp }}/specpilot-smoke" --json
          node bin/specpilot.js doctor "${{ runner.temp }}/specpilot-smoke" --json
          node bin/specpilot.js verify run --change smoke --task cli --phase green --path "${{ runner.temp }}/specpilot-smoke" -- node -e "process.exit(0)"
          node bin/specpilot.js update "${{ runner.temp }}/specpilot-smoke" --json

      - name: Uninstall managed runtime
        run: node bin/specpilot.js uninstall "${{ runner.temp }}/specpilot-smoke" --yes --json

      - name: Verify project artifacts were preserved
        env:
          SPEC_PILOT_SMOKE_ROOT: ${{ runner.temp }}/specpilot-smoke
        run: node -e "const fs=require('node:fs');const p=require('node:path');const r=process.env.SPEC_PILOT_SMOKE_ROOT;if(!fs.existsSync(p.join(r,'specs/project/glossary.md'))||!fs.existsSync(p.join(r,'.specpilot/evidence'))||!fs.existsSync(p.join(r,'.specpilot/local/knowledge-init.json')))process.exit(1)"
